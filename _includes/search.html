{% if site.post_search %}

<div id="beautifuljekyll-search-overlay">

  <button type="button" id="nav-search-exit" title="Exit search" aria-label="Close search">✕</button>
  <input type="text" id="nav-search-input" placeholder="Search" aria-label="Search posts">
  <ul id="search-results-container"></ul>

  <script src="{{ '/assets/external/simple-jekyll-search/simple-jekyll-search-1.10.0.min.js' | relative_url }}"></script>
  <script>
    SimpleJekyllSearch({
      searchInput: document.getElementById('nav-search-input'),
      resultsContainer: document.getElementById('search-results-container'),
      json: '{{ '/assets/data/searchcorpus.json' | relative_url }}'
    });
  </script>
</div>

{% endif %}
